<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Feedback · Jr EduHub</title>
  <link rel="stylesheet" href="./css/main_home.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
    <!-- Logo section -->
  <header class="header">
        <a class="logo">
            <img src="../main_home/image/logo.png" alt="Jr. EduHub Logo">
            <div>
              <div class="brand-name">EduHub</div>
              <div class="brand-tag">Feedback</div>
            </div>
        </a>
    </header>

  <h1 class="page-title">💬 Feedback</h1>
  <p class="subtitle">Your words help Jr EduHub grow better every day.</p>
  <div style="text-align:center; margin:6px 0 12px"><a class="back-link" href="../main_home/home.html">🏠︎ Home</a></div>

  <div class="frame narrow" style="max-width:640px">
    <form action="https://formsubmit.co/nielit-project-feedback@googlegroups.com" method="POST">
      <div class="grid-2">
        <div>
          <label class="form-label">Your name</label>
          <input class="input" name="name" placeholder="(Your Name)" required>
        </div>
        <div>
          <label class="form-label">Email</label>
          <input class="input" name="email" type="email" placeholder="(Your Email)" required>
        </div>
      </div>
      <label class="form-label">About which subject?</label>
      <select class="input" name="subject"  required>
        <option value="" disabled selected>Select a subject</option>
        <option value="geography">Geography</option>
        <option value="zoology">Zoology</option>
        <option value="mathematics">Mathematics</option>
        <option value="general">General</option>
      </select>
      
      <label class="form-label">Message</label>
      <textarea class="input" name="message" rows="4" required maxlength="2000"
                placeholder="Tell us what you loved, your experience, technical issues or what we should build next…"></textarea>

      <button type="submit" class="sub-btn">
        <i class="bi bi-send"></i> Send Feedback
      </button>
    </form>
  </div>
  <!-- Footer -->
        <footer class="site-footer">
            © 2026 Jr EduHub · Explore • Learn • Play • Discover
        </footer>
</body>
</html>
