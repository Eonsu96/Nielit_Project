<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Food Chain Game</title>

    <link rel="stylesheet"
          href="../assets/css/junior-games.css">
          <link rel="stylesheet" href="../assets/css/logo.css">

</head>

<body>

<header class="junior-header">

    <h1 class="junior-h1">
        Arrange the Food Chain
    </h1>

    <a class="junior-anchor"
       href="../index.html">
        Homepage
    </a>

    <a class="junior-anchor"
       href="index.html">
        Games
    </a>

</header>
<div class="site-logo">
    <img src="../../logo.png" alt="EduHub Logo">

    <div class="logo-text">
        <h1>EduHub</h1>
        <p class="subject">Zoology</p>
    </div>
</div>

<p class="junior-para">

    Click a stage, then click the correct position.

</p>

<h2 id="gameTitle">

    Food Chain 1 of 4

</h2>

<h2 id="score">

    Score : 0 / 15

</h2>


<div class="sequence-container">

    <div class="sequence-row">

        <div class="sequence-label">

            Primary Producer

        </div>

        <div class="sequence-slot">

            Drop Here

        </div>

    </div>


    <div class="sequence-row">

        <div class="sequence-label">

            Primary Consumer

        </div>

        <div class="sequence-slot">

            Drop Here

        </div>

    </div>


    <div class="sequence-row">

        <div class="sequence-label">

            Secondary Consumer

        </div>

        <div class="sequence-slot">

            Drop Here

        </div>

    </div>


    <div class="sequence-row">

        <div class="sequence-label">

            Tertiary Consumer

        </div>

        <div class="sequence-slot">

            Drop Here

        </div>

    </div>


    <div class="sequence-row">

        <div class="sequence-label">

            Apex Predator

        </div>

        <div class="sequence-slot">

            Drop Here

        </div>

    </div>

</div>


<h2 class="drag-title">

    Choose the Stages

</h2>


<div class="drag-container"
     id="dragContainer">

    <!-- JavaScript loads the stage cards here -->

</div>


<div class="next-button-wrapper">

    <button id="nextButton">

        Next ▶

    </button>

</div>


<h2 id="message"></h2>


<!-- Sounds -->

<audio id="correctSound">
    <source src="../assets/sounds/correct.mp3"
            type="audio/mpeg">
</audio>

<audio id="wrongSound">
    <source src="../assets/sounds/wrong.mp3"
            type="audio/mpeg">
</audio>

<audio id="winSound">
    <source src="../assets/sounds/win.mp3"
            type="audio/mpeg">
</audio>


<!-- Wrong Answer -->

<div id="customAlert"
     class="custom-alert">

    <div class="alert-box">

        <p id="alertText"></p>

        <button onclick="closeAlert()">

            OK

        </button>

    </div>

</div>


<script src="../assets/javascript/junior-games-foodchain.js"></script>

</body>

</html>
