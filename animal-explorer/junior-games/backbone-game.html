<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vertebrates and Invertebrates Game</title>

    <link rel="stylesheet"
          href="../assets/css/junior-games.css">
          <link rel="stylesheet" href="../assets/css/logo.css">

</head>

<body>

<header class="junior-header">

    <h1 class="junior-h1">
        Vertebrates and Invertebrates
    </h1>

    <a class="junior-anchor"
       href="../index.html">
        Homepage
    </a>

    <a class="junior-anchor"
       href="index.html">
        Games
    </a>

</header>
<div class="site-logo">
    <img src="../../logo.png" alt="EduHub Logo">

    <div class="logo-text">
        <h1>EduHub</h1>
        <p class="subject">Zoology</p>
    </div>
</div>

<p class="junior-para">
    Click an animal and then click the correct group.
</p>

<h2 id="score">
    Score : 0 / 8
</h2>


<div class="classify-container">

    <!-- Vertebrates -->

    <div class="category">

        <h2 class="category-title">
            Vertebrates
        </h2>

        <div class="drop-zone big-zone"
             data-group="vertebrates">

            Click Here

        </div>

    </div>


    <!-- Invertebrates -->

    <div class="category">

        <h2 class="category-title">
            Invertebrates
        </h2>

        <div class="drop-zone big-zone"
             data-group="invertebrates">

            Click Here

        </div>

    </div>

</div>


<h2 class="drag-title">
    Animals
</h2>

<div class="drag-container">

    <div class="drag-item"
         data-group="vertebrates">
        Lion
    </div>

    <div class="drag-item"
         data-group="vertebrates">
        Cow
    </div>

    <div class="drag-item"
         data-group="vertebrates">
        Duck
    </div>

    <div class="drag-item"
         data-group="vertebrates">
        Elephant
    </div>

    <div class="drag-item"
         data-group="invertebrates">
        Butterfly
    </div>

    <div class="drag-item"
         data-group="invertebrates">
        Spider
    </div>

    <div class="drag-item"
         data-group="invertebrates">
        Earthworm
    </div>

    <div class="drag-item"
         data-group="invertebrates">
        Octopus
    </div>

</div>

<h2 id="message"></h2>


<!-- Sounds -->

<audio id="correctSound">
    <source src="../assets/sounds/correct.mp3"
            type="audio/mpeg">
</audio>

<audio id="wrongSound">
    <source src="../assets/sounds/wrong.mp3"
            type="audio/mpeg">
</audio>

<audio id="winSound">
    <source src="../assets/sounds/win.mp3"
            type="audio/mpeg">
</audio>


<!-- Wrong Answer -->

<div id="customAlert"
     class="custom-alert">

    <div class="alert-box">

        <p id="alertText"></p>

        <button onclick="closeAlert()">
            OK
        </button>

    </div>

</div>


<script src="../assets/javascript/junior-games-sort.js"></script>

</body>

</html>
